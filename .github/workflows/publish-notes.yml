name: 建置並發佈讀書筆記

# 手機流程：在 GitHub 網頁編輯器新增 notes/src/<slug>.md（只要 source ＋ title ＋ 散文），
# commit 之後這個 workflow 會補完 metadata、建置、把產出推回 main，
# GitHub Pages 自動更新，並觸發 Cloudflare 鏡像部署。全程不需要回到電腦。

on:
  push:
    branches: [main]
    paths:
      - 'notes/src/**'
      - 'scripts/build.py'
      - 'scripts/enrich.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-notes
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 從 private repo twitter_article 撈作者／原文網址／發表日／封面圖。
      # 沒設 SOURCE_REPO_TOKEN 也不會失敗——只是 metadata 停留在你手寫的那幾行。
      - name: 補完 metadata
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: python3 scripts/enrich.py

      - name: 建置
        run: python3 scripts/build.py

      # build.py 的產出是 deterministic（沒有 now() 時間戳），
      # 所以內容沒變就不會有 commit，不會觸發自己。
      # enrich.py 會改寫 notes/src/*.md（在觸發路徑內），故仍加 [skip ci] 保險。
      - name: 提交產出
        run: |
          git config user.name "chris-os-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "沒有變更，不需要 commit"
          else
            git commit -m "build: 更新讀書筆記產出 [skip ci]"
            git push
          fi

      # Cloudflare 鏡像。若已在 Cloudflare 後台重新 Connect to Git（會裝 webhook），
      # 這步就多餘了，可以整段拿掉。
      - name: 觸發 Cloudflare 部署
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "未設 CF_API_TOKEN，跳過鏡像部署"
            exit 0
          fi
          ACCOUNT=b38329a6da496cab8f08045175400e8a
          curl -sf -X POST \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/pages/projects/chris-os/deployments" \
            -F "branch=main" > /dev/null && echo "已觸發 Cloudflare 部署"
